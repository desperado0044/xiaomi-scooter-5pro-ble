name: Compatibility report / Kompatibilitätsbericht
description: Does the app work with your scooter? (English or German)
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Please do NOT post MAC addresses, keys, PINs or export files. / Bitte keine MAC-Adressen, Schlüssel, PINs oder Exportdateien posten.
  - type: dropdown
    id: model
    attributes:
      label: Scooter model / Modell
      options:
        - Xiaomi Electric Scooter 5
        - Xiaomi Electric Scooter 5 Pro
        - Xiaomi Electric Scooter 5 Max
        - Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version / App-Version
      placeholder: e.g. 2.2
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What worked, what did not? / Was hat funktioniert, was nicht?
      description: Optional - firmware version, phone and Android version help.
