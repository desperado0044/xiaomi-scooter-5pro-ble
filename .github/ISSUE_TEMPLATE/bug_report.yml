name: Bug report / Fehlermeldung
description: Something in the app does not work as expected (English or German).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please do NOT post** your scooter's MAC address, access keys, PIN, export codes or files, or screenshots that show them.
        Bitte **keine** MAC-Adresse, Schlüssel, PIN, Exportcodes/-dateien oder Screenshots davon posten.
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / So lässt es sich nachstellen
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / Was hast du erwartet?
  - type: input
    id: app_version
    attributes:
      label: App version / App-Version
      placeholder: e.g. 2.2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Scooter model and firmware / Modell und Firmware
      placeholder: e.g. 5 Pro, 2.7.0_0015.xxxx
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version / Handy und Android-Version
